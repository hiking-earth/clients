[package]
name = "hiking-earth-desktop"
version = "0.2.3"
description = "徒步地球桌面端（Tauri 壳）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tempfile = "3"
tauri-plugin-updater = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
opt-level = "s"
strip = true
