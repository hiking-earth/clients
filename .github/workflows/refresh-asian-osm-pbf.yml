name: Refresh bounded Asia OSM extracts
on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-asian-osm-pbf
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned PBF reader
        run: python -m pip install -r scripts/requirements-pbf.txt
      - name: Refresh Asia country extracts with per-file storage caps
        id: refresh
        continue-on-error: true
        run: python scripts/refresh-asian-osm-pbf.py
      - name: Record bounded source refresh
        if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: echo "Regional OSM refresh step: $REFRESH_OUTCOME. Data remains pending verification; no opening status or navigation permission is inferred." >> "$GITHUB_STEP_SUMMARY"
      - name: Commit successful source updates and evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/data/catalog/osm.json docs/release/osm-asia-pbf-refresh-*.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh bounded Asian OSM route extracts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
