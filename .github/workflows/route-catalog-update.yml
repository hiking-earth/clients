name: Refresh public hiking catalog
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: route-catalog-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    # The 15 sequential source-specific timeouts total 191 minutes; the job cap leaves 49 minutes for validation/publication/deploy.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled workflows live on main; collectors and validation live here.
          # Publication promotes only validated public data, never client releases.
          ref: codex/mobile-privacy-controls
      - uses: actions/checkout@v4
        with:
          # Validate the workflow that started this run, not the collector branch's copy.
          ref: ${{ github.sha }}
          path: workflow-source
          sparse-checkout: |
            .github/workflows/route-catalog-update.yml
            scripts/validate-route-workflow-budget.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce route collector time budget
        run: python workflow-source/scripts/validate-route-workflow-budget.py
      - name: Merge production OSM discoveries and PBF refresh evidence
        run: python scripts/merge-production-osm-catalog.py --production-ref origin/main
      - name: Collect USDA source records
        id: usda
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/update-usfs-catalog.py
      - name: Collect recent OSM changes
        id: osm_incremental
        timeout-minutes: 30
        continue-on-error: true
        run: python scripts/update-route-catalog.py
      - name: Collect Hong Kong AFCD trails
        id: hk
        timeout-minutes: 5
        continue-on-error: true
        run: python scripts/update-hk-catalog.py
      - name: Collect New Zealand DOC walking routes
        id: nzdoc
        timeout-minutes: 25
        continue-on-error: true
        run: python scripts/update-nzdoc-catalog.py
      - name: Collect Parks Canada trails
        id: parkscanada
        timeout-minutes: 25
        continue-on-error: true
        run: python scripts/update-canada-parks-catalog.py
      - name: Collect NPS public hiking and pedestrian trail references
        id: nps_public_trails
        timeout-minutes: 25
        continue-on-error: true
        run: python scripts/update-nps-public-trails-catalog.py
      - name: Collect Victorian Government walking-track references
        id: victoria_recreation_tracks
        timeout-minutes: 8
        continue-on-error: true
        run: python scripts/update-victoria-recreation-tracks.py
      - name: Collect NSW NPWS walking tracks
        id: nsw_npws
        timeout-minutes: 12
        continue-on-error: true
        run: python scripts/update-nsw-npws-catalog.py
      - name: Collect Natural England national trails
        id: england
        timeout-minutes: 8
        continue-on-error: true
        run: python scripts/update-england-national-trails.py
      - name: Collect Natural Resources Wales national trails
        id: wales
        timeout-minutes: 8
        continue-on-error: true
        run: python scripts/update-wales-national-trails.py
      - name: Collect Argyll and Bute adopted core paths
        id: scotland_argyll
        timeout-minutes: 12
        continue-on-error: true
        run: python scripts/update-scotland-argyll-corepaths.py
      - name: Collect Mid Ulster public rights of way
        id: ni_midulster
        timeout-minutes: 5
        continue-on-error: true
        run: python scripts/update-ni-midulster-prow.py
      - name: Collect Norfolk public rights of way
        id: norfolk_prow
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/update-norfolk-prow.py
      - name: Collect Cambridgeshire public rights of way
        id: cambridgeshire_prow
        timeout-minutes: 5
        continue-on-error: true
        run: python scripts/update-cambridgeshire-prow.py
      - name: Collect official announcements
        id: content
        timeout-minutes: 3
        continue-on-error: true
        run: python scripts/update-official-content.py
      - name: Record collection outcomes
        id: outcomes
        if: always()
        env:
          USDA_OUTCOME: ${{ steps.usda.outcome }}
          OSM_INCREMENTAL_OUTCOME: ${{ steps.osm_incremental.outcome }}
          OSM_RECONCILIATION_OUTCOME: paused-public-global-sweep
          HK_OUTCOME: ${{ steps.hk.outcome }}
          NZDOC_OUTCOME: ${{ steps.nzdoc.outcome }}
          PARKSCANADA_OUTCOME: ${{ steps.parkscanada.outcome }}
          NPS_PUBLIC_TRAILS_OUTCOME: ${{ steps.nps_public_trails.outcome }}
          VICTORIA_RECREATION_TRACKS_OUTCOME: ${{ steps.victoria_recreation_tracks.outcome }}
          NSW_NPWS_OUTCOME: ${{ steps.nsw_npws.outcome }}
          ENGLAND_OUTCOME: ${{ steps.england.outcome }}
          WALES_OUTCOME: ${{ steps.wales.outcome }}
          SCOTLAND_ARGYLL_OUTCOME: ${{ steps.scotland_argyll.outcome }}
          NI_MIDULSTER_OUTCOME: ${{ steps.ni_midulster.outcome }}
          NORFOLK_PROW_OUTCOME: ${{ steps.norfolk_prow.outcome }}
          CAMBRIDGESHIRE_PROW_OUTCOME: ${{ steps.cambridgeshire_prow.outcome }}
          CONTENT_OUTCOME: ${{ steps.content.outcome }}
        run: |
          echo "### Hiking catalog collection" >> "$GITHUB_STEP_SUMMARY"
          echo "USDA step: $USDA_OUTCOME; OSM recent-change script step: $OSM_INCREMENTAL_OUTCOME; OSM worldwide full-membership sweep: $OSM_RECONCILIATION_OUTCOME; Hong Kong AFCD: $HK_OUTCOME; New Zealand DOC: $NZDOC_OUTCOME; Parks Canada: $PARKSCANADA_OUTCOME; NPS public trails: $NPS_PUBLIC_TRAILS_OUTCOME; Victoria recreation tracks: $VICTORIA_RECREATION_TRACKS_OUTCOME; NSW NPWS: $NSW_NPWS_OUTCOME; Natural England: $ENGLAND_OUTCOME; Natural Resources Wales: $WALES_OUTCOME; Argyll and Bute core paths: $SCOTLAND_ARGYLL_OUTCOME; Mid Ulster public rights of way: $NI_MIDULSTER_OUTCOME; Norfolk public rights of way: $NORFOLK_PROW_OUTCOME; Cambridgeshire public rights of way: $CAMBRIDGESHIRE_PROW_OUTCOME; official notices: $CONTENT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import datetime, hashlib, json, os
          from collections import Counter
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('scripts').resolve()))
          from catalog_collection_status import news_source_status, pbf_catalog_coverage, pbf_refresh_status, pbf_route_provenance_status
          root = Path('shared/data')
          sources = [
              ('OSM', root/'catalog/osm.json', 'routes'),
              ('USFS', root/'catalog/usfs.json', 'routes'),
              ('Hong Kong AFCD', root/'catalog/hk-afcd.json', 'routes'),
              ('New Zealand DOC', root/'catalog/nzdoc.json', 'routes'),
              ('Parks Canada', root/'catalog/canada-parks.json', 'routes'),
              ('NPS public trails', root/'catalog/nps-public-trails.json', 'routes'),
              ('Victoria recreation tracks', root/'catalog/victoria-recreation-tracks.json', 'routes'),
              ('NSW NPWS', root/'catalog/nsw-npws.json', 'routes'),
              ('Natural England', root/'catalog/england-trails.json', 'routes'),
              ('Natural Resources Wales', root/'catalog/wales-trails.json', 'routes'),
              ('Argyll and Bute', root/'catalog/scotland-argyll-corepaths.json', 'routes'),
              ('Mid Ulster Public Rights of Way', root/'catalog/ni-midulster-prow.json', 'routes'),
              ('Norfolk Public Rights of Way', root/'catalog/norfolk-prow.json', 'routes'),
              ('Cambridgeshire Public Rights of Way', root/'catalog/cambridgeshire-prow.json', 'routes'),
              ('Official notices', root/'content/official-news.json', 'items'),
          ]
          outcomes = dict(zip(('usfs','osm_incremental','osm_reconciliation','hk','nzdoc','parkscanada','nsw-npws','england','wales','scotland-argyll','ni-midulster','norfolk-prow','cambridgeshire-prow','news'), (os.environ.get(key, 'unknown') for key in ('USDA_OUTCOME','OSM_INCREMENTAL_OUTCOME','OSM_RECONCILIATION_OUTCOME','HK_OUTCOME','NZDOC_OUTCOME','PARKSCANADA_OUTCOME','NSW_NPWS_OUTCOME','ENGLAND_OUTCOME','WALES_OUTCOME','SCOTLAND_ARGYLL_OUTCOME','NI_MIDULSTER_OUTCOME','NORFOLK_PROW_OUTCOME','CAMBRIDGESHIRE_PROW_OUTCOME','CONTENT_OUTCOME'))))
          outcomes['osm'] = outcomes['osm_reconciliation']
          outcomes['nps-public-trails'] = os.environ.get('NPS_PUBLIC_TRAILS_OUTCOME', 'unknown')
          outcomes['victoria-recreation-tracks'] = os.environ.get('VICTORIA_RECREATION_TRACKS_OUTCOME', 'unknown')
          snapshots = {}
          rows = ['| Source snapshot | Records | Generated |', '|---|---:|---|']
          for label, path, key in sources:
              raw = path.read_bytes()
              data = json.loads(raw)
              snapshots[label] = {'records': len(data.get(key, [])), 'generatedAt': data.get('generatedAt'), 'sha256': hashlib.sha256(raw).hexdigest()}
              rows.append(f"| {label} | {len(data.get(key, []))} | {data.get('generatedAt', 'unknown')} |")
          osm = json.loads((root/'catalog/osm.json').read_text())
          backfill = osm.get('backfill', {})
          membership = osm.get('backfillState', {})
          region_names = ('china','japan','south-asia','europe','north-america','oceania','south-america','africa')
          refresh_counts = osm.get('lastRefreshCounts', {})
          if not isinstance(refresh_counts, dict):
              refresh_counts = osm.get('coverage', {})
          if not isinstance(refresh_counts, dict):
              refresh_counts = {}
          source_cursors = osm.get('sourceCursors', {}) if isinstance(osm.get('sourceCursors'), dict) else {}
          failures = osm.get('failures', []) if isinstance(osm.get('failures'), list) else []
          failed_regions = {item.get('region'): str(item.get('error', 'source request failed'))[:500] for item in failures if isinstance(item, dict) and isinstance(item.get('region'), str)}
          if outcomes['osm_incremental'] == 'success':
              region_attempts = {}
              for region in region_names:
                  if region in failed_regions:
                      region_attempts[region] = {'status': 'failed', 'error': failed_regions[region]}
                  elif region in refresh_counts:
                      region_attempts[region] = {'status': 'success', 'records': refresh_counts[region], 'cursor': source_cursors.get(region)}
                  else:
                      region_attempts[region] = {'status': 'not-reported'}
              refreshed = sum(1 for item in region_attempts.values() if item['status'] == 'success')
              failed = sum(1 for item in region_attempts.values() if item['status'] == 'failed')
              not_reported = sum(1 for item in region_attempts.values() if item['status'] == 'not-reported')
              osm_incremental_status = 'success' if refreshed == len(region_names) and failed == 0 else 'partial' if refreshed else 'failure'
          else:
              region_attempts = {region: {'status': 'step-' + outcomes['osm_incremental']} for region in region_names}
              refreshed = failed = 0; not_reported = len(region_names)
              osm_incremental_status = 'failure' if outcomes['osm_incremental'] == 'failure' else 'unknown'
          outcomes['osm_incremental_step'] = outcomes['osm_incremental']
          outcomes['osm_incremental'] = osm_incremental_status
          usfs = json.loads((root/'catalog/usfs.json').read_text())
          usfs_progress = usfs.get('backfill', {})
          reconciliation = {
              'osm': {
                  'supported': membership.get('reconciliationVersion') == 1,
                  'cycleStartedAt': membership.get('cycleStartedAt'),
                  'lastCompletedAt': membership.get('lastCompletedAt'),
                  'lastRemovedFromDiscovery': membership.get('lastRemovedFromDiscovery'),
              'pendingTiles': backfill.get('pendingTiles'),
              'currentCycleComplete': membership.get('reconciliationVersion') == 1 and backfill.get('pendingTiles') == 0,
              'scheduled': False,
              'pauseReason': 'Public Overpass documentation discourages stitching bounding boxes to scrape worldwide data; use regional extracts or an owner-approved sustainable service.',
              'lastAttemptSucceeded': None,
              'incrementalAttemptSucceeded': osm_incremental_status == 'success',
              'incrementalOutcome': osm_incremental_status,
              'incrementalRegions': region_attempts,
              },
              'usfs': {
                  'supported': usfs_progress.get('reconciliationVersion') == 2,
                  'cycleStartedAt': usfs_progress.get('cycleStartedAt'),
                  'lastCompletedAt': usfs_progress.get('lastCompletedAt'),
                  'lastRemovedFromDiscovery': usfs_progress.get('lastRemovedFromDiscovery'),
                  'nextObjectId': usfs_progress.get('nextObjectId'),
                  'currentCycleComplete': usfs_progress.get('reconciliationVersion') == 2 and usfs_progress.get('nextObjectId') is None and bool(usfs_progress.get('lastCompletedAt')),
                  'lastAttemptSucceeded': outcomes['usfs'] == 'success',
              },
              'hk': {
                  'mode': 'complete-source-replacement',
                  'lastAttemptSucceeded': outcomes['hk'] == 'success',
              },
              'nzdoc': {
                  'mode': 'complete-source-replacement',
                  'lastAttemptSucceeded': outcomes['nzdoc'] == 'success',
              },
              'parkscanada': {
                  'mode': 'complete-source-replacement',
                  'lastAttemptSucceeded': outcomes['parkscanada'] == 'success',
              },
              'nps-public-trails': {
                  'mode': 'complete-source-replacement',
                  'lastAttemptSucceeded': outcomes['nps-public-trails'] == 'success',
              },
              'victoria-recreation-tracks': {
                  'mode': 'complete-source-replacement',
                  'lastAttemptSucceeded': outcomes['victoria-recreation-tracks'] == 'success',
              },
              'nsw-npws': {
                  'mode': 'complete-source-replacement',
                  'lastAttemptSucceeded': outcomes['nsw-npws'] == 'success',
              },
              'england': {
                  'mode': 'complete-source-replacement',
                  'lastAttemptSucceeded': outcomes['england'] == 'success',
              },
              'wales': {
                  'mode': 'complete-source-replacement',
                  'lastAttemptSucceeded': outcomes['wales'] == 'success',
              },
              'scotland-argyll': {
                  'mode': 'complete-source-replacement',
                  'lastAttemptSucceeded': outcomes['scotland-argyll'] == 'success',
              },
              'ni-midulster': {
                  'mode': 'complete-source-replacement',
                  'lastAttemptSucceeded': outcomes['ni-midulster'] == 'success',
              },
              'norfolk-prow': {
                  'mode': 'complete-source-replacement',
                  'lastAttemptSucceeded': outcomes['norfolk-prow'] == 'success',
              },
              'cambridgeshire-prow': {
                  'mode': 'complete-source-replacement',
                  'lastAttemptSucceeded': outcomes['cambridgeshire-prow'] == 'success',
              },
          }
          for source, progress in reconciliation.items():
              rows.append(f"| Membership reconciliation: {source} | last removed {progress.get('lastRemovedFromDiscovery', 'not recorded')} | complete {progress.get('currentCycleComplete', 'not applicable')}; attempt {outcomes[source]} |")
          pbf_refreshes = []
          for region in ('africa', 'asia', 'europe', 'south-america', 'oceania', 'north-america', 'china', 'japan'):
              reports = sorted(Path('docs/release').glob(f'osm-{region}-pbf-refresh-*.json'))
              if not reports:
                  pbf_refreshes.append({'region': region, 'status': 'not-recorded', 'accessVerified': False, 'navigableGeometryAdded': False})
                  rows.append(f'| Geofabrik PBF refresh: {region} | no report | source coverage not established |')
                  continue
              report_path = reports[-1]
              try:
                  summary = pbf_refresh_status(json.loads(report_path.read_text()))
                  summary['report'] = str(report_path)
                  summary['status'] = 'partial' if int(summary.get('lastRunFailureCount') or 0) else 'success'
              except (OSError, ValueError, json.JSONDecodeError, TypeError):
                  summary = {'region': region, 'report': str(report_path), 'status': 'invalid-report', 'accessVerified': False, 'navigableGeometryAdded': False}
              pbf_refreshes.append(summary)
              rows.append(f"| Geofabrik PBF refresh: {region} | {summary.get('latestSourceCount', 0)} source snapshots; last run {summary.get('lastRunSuccessCount', 'unknown')} succeeded / {summary.get('lastRunFailureCount', 'unknown')} failed | {summary.get('lastCompletedAt', 'not recorded')} | access verified: false |")
          pbf_coverage = pbf_catalog_coverage(osm)
          for item in pbf_coverage:
              schedule = 'scheduled monthly' if item['scheduledRefresh'] else 'no scheduled PBF refresh'
              rows.append(f"| Geofabrik PBF catalog: {item['region']} | {item['sourceCount']} sources; newest source {item.get('newestSourceTimestamp', 'unknown')} | {schedule}; discovery only |")
          provenance = pbf_route_provenance_status(osm)
          rows.append(f"| OSM route source provenance | {provenance['routesWithPbfSource']} / {provenance['totalRoutes']} routes have PBF source attribution; {provenance['legacyOrUnattributedRoutes']} legacy/unattributed; {provenance['invalidProvenanceRoutes']} invalid | global withdrawal safe: {provenance['safeForGlobalWithdrawal']} |")
          regions = Counter(route.get('region', 'unknown') for route in osm.get('routes', []))
          rows.append('| OSM records by region | ' + '; '.join(f'{name}: {count}' for name, count in sorted(regions.items())) + ' | source tags only |')
          rows.append(f"| OSM grid backfill | {backfill.get('completedTiles', 0)} complete / {backfill.get('pendingTiles', 0)} pending | cycle {backfill.get('cycle', 0)} |")
          rows.append(f"| OSM recent changes | {refreshed} / {len(region_names)} regions refreshed; {failed} reported failures; {not_reported} not reported | {osm_incremental_status} (step {outcomes['osm_incremental_step']}) |")
          rows.extend(f"| OSM recent changes: {region} | {item['status']} | {item.get('records', item.get('error', ''))} |" for region, item in region_attempts.items())
          budget = osm.get('sourceBudget', {})
          rows.append(f"| OSM public API budget | {budget.get('downloadedBytes', 0)} / {budget.get('dailyByteLimit', 8388608)} bytes; {budget.get('queryCount', 0)} / {budget.get('dailyQueryLimit', 64)} queries | UTC day {budget.get('dateUTC', 'not recorded')} |")
          news = json.loads((root/'content/official-news.json').read_text())
          registry = json.loads((root/'content/official-sources.json').read_text())
          news_states = {source['id']: source for source in news.get('sources', [])}
          news_counts = Counter(item.get('sourceId', 'unknown') for item in news.get('items', []))
          news_sources = []
          for source in registry['sources']:
              state = news_states.get(source['id'], {})
              source_status = news_source_status(source, state, news_counts[source['id']])
              news_sources.append(source_status)
              rows.append(f"| Official notices: {source['id']} | {news_counts[source['id']]} | {source_status['status']}; feed verification {source_status['feedVerificationStatus']}; last success {state.get('lastSuccess', 'none')} |")
          status = {'schemaVersion': 1, 'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'runId': os.environ['GITHUB_RUN_ID'], 'sourceCommit': os.environ['GITHUB_SHA'], 'outcomes': outcomes, 'newsSources': news_sources, 'reconciliation': reconciliation, 'pbfExtractRefreshes': pbf_refreshes, 'pbfCatalogCoverage': pbf_coverage, 'pbfRouteProvenance': provenance, 'snapshots': snapshots, 'accessVerified': False}
          status_path = Path('shared/public-catalog/collection-status.json')
          status_path.parent.mkdir(parents=True, exist_ok=True)
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(rows) + '\n')
          PY
          echo "Failed sources retain their previous catalog. Automatic collection does not verify trail access or produce navigable geometry." >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare immutable compressed catalog pages
        id: prepare_catalog
        if: ${{ !cancelled() && steps.outcomes.outcome == 'success' }}
        run: python scripts/prepare-catalog-pages.py
      - name: Publish changed snapshot
        id: publish
        if: ${{ !cancelled() && steps.outcomes.outcome == 'success' && steps.prepare_catalog.outcome == 'success' }}
        run: |
          git add shared/data/catalog/ shared/data/content/ shared/data/offline/ shared/public-catalog/ app/cloudfunctions/catalog-feed/snapshots/ app/cloudfunctions/client-api/business/catalog-feed/snapshots/ 'docs/release/osm-*-pbf-refresh-*.json'
          if git diff --cached --quiet -- shared/data/catalog/ shared/data/content/ shared/data/offline/ shared/public-catalog/ app/cloudfunctions/catalog-feed/snapshots/ app/cloudfunctions/client-api/business/catalog-feed/snapshots/ 'docs/release/osm-*-pbf-refresh-*.json'; then
            echo "catalog_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "catalog_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'hiking-earth-catalog[bot]'
          git config user.email 'catalog@users.noreply.github.com'
          git commit -m 'data: refresh sourced hiking discovery catalogs'
          # Preserve source/doc commits added while the collectors were running.
          # A concurrent data conflict stops publication rather than overwriting it.
          git pull --rebase origin codex/mobile-privacy-controls
          git push
      - name: Publish validated pages to production read branch
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: python scripts/publish-public-catalog.py
      - name: Set up Node.js for CloudBase CLI
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && steps.publish.outputs.catalog_changed == 'true' && vars.HIKING_CATALOG_AUTODEPLOY == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Deploy changed catalog snapshots to CloudBase
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && steps.publish.outputs.catalog_changed == 'true' && vars.HIKING_CATALOG_AUTODEPLOY == 'true' }}
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          CLOUDBASE_ENV_ID: ${{ vars.CLOUDBASE_ENV_ID }}
        run: |
          set -euo pipefail
          test -n "$TENCENT_SECRET_ID"
          test -n "$TENCENT_SECRET_KEY"
          test -n "$CLOUDBASE_ENV_ID"
          node --version
          npm install --global @cloudbase/cli@2.6.16
          CLI_PATH="$(command -v tcb)"
          node "$CLI_PATH" login --apiKeyId "$TENCENT_SECRET_ID" --apiKey "$TENCENT_SECRET_KEY"
          BACKUP_DIR="$RUNNER_TEMP/hiking-catalog-cloudbase-$GITHUB_RUN_ID"
          python3 scripts/deploy-client-functions.py \
            --cloudbase-cli "$CLI_PATH" \
            --node "$(command -v node)" \
            --env "$CLOUDBASE_ENV_ID" \
            --backup-dir "$BACKUP_DIR" \
            --functions catalog-feed client-api
      - name: Report incomplete collection sources
        if: ${{ !cancelled() && steps.outcomes.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('shared/public-catalog/collection-status.json').read_text())
          outcomes = status.get('outcomes', {})
          sources = (
              'usfs', 'osm_incremental', 'hk', 'nzdoc', 'parkscanada',
              'nps-public-trails', 'victoria-recreation-tracks', 'nsw-npws',
              'england', 'wales', 'scotland-argyll', 'ni-midulster',
              'norfolk-prow', 'cambridgeshire-prow', 'news',
          )
          incomplete = {source: outcomes.get(source, 'unknown') for source in sources
                        if outcomes.get(source) != 'success'}
          if incomplete:
              print('Some sources failed or partially refreshed; successful validated sources were published and failed sources retained their prior snapshots:')
              for source, result in incomplete.items():
                  print(f'- {source}: {result}')
              raise SystemExit(1)
          print('All configured source collectors completed successfully.')
          PY
