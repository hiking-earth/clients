name: Refresh public hiking catalog
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: route-catalog-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect USDA source records
        id: usda
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/update-usfs-catalog.py
      - name: Collect recent OSM changes
        id: osm_incremental
        timeout-minutes: 30
        continue-on-error: true
        run: python scripts/update-route-catalog.py
      - name: Reconcile OSM spatial membership
        id: osm
        timeout-minutes: 25
        continue-on-error: true
        run: python scripts/backfill-osm-catalog.py --tiles 24
      - name: Collect Hong Kong AFCD trails
        id: hk
        timeout-minutes: 5
        continue-on-error: true
        run: python scripts/update-hk-catalog.py
      - name: Collect official announcements
        id: content
        timeout-minutes: 3
        continue-on-error: true
        run: python scripts/update-official-content.py
      - name: Record collection outcomes
        if: always()
        env:
          USDA_OUTCOME: ${{ steps.usda.outcome }}
          OSM_INCREMENTAL_OUTCOME: ${{ steps.osm_incremental.outcome }}
          OSM_RECONCILIATION_OUTCOME: ${{ steps.osm.outcome }}
          HK_OUTCOME: ${{ steps.hk.outcome }}
          CONTENT_OUTCOME: ${{ steps.content.outcome }}
        run: |
          echo "### Hiking catalog collection" >> "$GITHUB_STEP_SUMMARY"
          echo "USDA: $USDA_OUTCOME; OSM recent changes: $OSM_INCREMENTAL_OUTCOME; OSM full membership: $OSM_RECONCILIATION_OUTCOME; Hong Kong AFCD: $HK_OUTCOME; official notices: $CONTENT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import datetime, hashlib, json, os
          from collections import Counter
          from pathlib import Path
          root = Path('shared/data')
          sources = [
              ('OSM', root/'catalog/osm.json', 'routes'),
              ('USFS', root/'catalog/usfs.json', 'routes'),
              ('Hong Kong AFCD', root/'catalog/hk-afcd.json', 'routes'),
              ('Official notices', root/'content/official-news.json', 'items'),
          ]
          outcomes = dict(zip(('usfs','osm_incremental','osm_reconciliation','hk','news'), (os.environ.get(key, 'unknown') for key in ('USDA_OUTCOME','OSM_INCREMENTAL_OUTCOME','OSM_RECONCILIATION_OUTCOME','HK_OUTCOME','CONTENT_OUTCOME'))))
          outcomes['osm'] = outcomes['osm_reconciliation']
          snapshots = {}
          rows = ['| Source snapshot | Records | Generated |', '|---|---:|---|']
          for label, path, key in sources:
              raw = path.read_bytes()
              data = json.loads(raw)
              snapshots[label] = {'records': len(data.get(key, [])), 'generatedAt': data.get('generatedAt'), 'sha256': hashlib.sha256(raw).hexdigest()}
              rows.append(f"| {label} | {len(data.get(key, []))} | {data.get('generatedAt', 'unknown')} |")
          osm = json.loads((root/'catalog/osm.json').read_text())
          backfill = osm.get('backfill', {})
          membership = osm.get('backfillState', {})
          usfs = json.loads((root/'catalog/usfs.json').read_text())
          usfs_progress = usfs.get('backfill', {})
          reconciliation = {
              'osm': {
                  'supported': membership.get('reconciliationVersion') == 1,
                  'cycleStartedAt': membership.get('cycleStartedAt'),
                  'lastCompletedAt': membership.get('lastCompletedAt'),
                  'lastRemovedFromDiscovery': membership.get('lastRemovedFromDiscovery'),
                  'pendingTiles': backfill.get('pendingTiles'),
                  'currentCycleComplete': membership.get('reconciliationVersion') == 1 and backfill.get('pendingTiles') == 0,
                  'lastAttemptSucceeded': outcomes['osm'] == 'success',
                  'incrementalAttemptSucceeded': outcomes['osm_incremental'] == 'success',
              },
              'usfs': {
                  'supported': usfs_progress.get('reconciliationVersion') == 1,
                  'cycleStartedAt': usfs_progress.get('cycleStartedAt'),
                  'lastCompletedAt': usfs_progress.get('lastCompletedAt'),
                  'lastRemovedFromDiscovery': usfs_progress.get('lastRemovedFromDiscovery'),
                  'nextObjectId': usfs_progress.get('nextObjectId'),
                  'currentCycleComplete': usfs_progress.get('reconciliationVersion') == 1 and usfs_progress.get('nextObjectId') is None and bool(usfs_progress.get('lastCompletedAt')),
                  'lastAttemptSucceeded': outcomes['usfs'] == 'success',
              },
              'hk': {
                  'mode': 'complete-source-replacement',
                  'lastAttemptSucceeded': outcomes['hk'] == 'success',
              },
          }
          for source, progress in reconciliation.items():
              rows.append(f"| Membership reconciliation: {source} | last removed {progress.get('lastRemovedFromDiscovery', 'not recorded')} | complete {progress.get('currentCycleComplete', 'not applicable')}; attempt {outcomes[source]} |")
          regions = Counter(route.get('region', 'unknown') for route in osm.get('routes', []))
          rows.append('| OSM records by region | ' + '; '.join(f'{name}: {count}' for name, count in sorted(regions.items())) + ' | source tags only |')
          rows.append(f"| OSM grid backfill | {backfill.get('completedTiles', 0)} complete / {backfill.get('pendingTiles', 0)} pending | cycle {backfill.get('cycle', 0)} |")
          rows.append(f"| OSM recent changes | {len(osm.get('coverage', {}))} regions refreshed | incremental {outcomes['osm_incremental']} |")
          news = json.loads((root/'content/official-news.json').read_text())
          registry = json.loads((root/'content/official-sources.json').read_text())
          news_states = {source['id']: source for source in news.get('sources', [])}
          news_counts = Counter(item.get('sourceId', 'unknown') for item in news.get('items', []))
          news_sources = []
          for source in registry['sources']:
              state = news_states.get(source['id'], {})
              health = 'failed' if state.get('lastError') else 'available' if state.get('lastSuccess') else 'pending'
              news_sources.append({'id': source['id'], 'status': health, 'records': news_counts[source['id']], 'lastCollectedCount': state.get('lastCollectedCount'), 'lastAttempt': state.get('lastAttempt'), 'lastSuccess': state.get('lastSuccess'), 'feedVerified': False})
              rows.append(f"| Official notices: {source['id']} | {news_counts[source['id']]} | {health}; last success {state.get('lastSuccess', 'none')} |")
          status = {'schemaVersion': 1, 'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'runId': os.environ['GITHUB_RUN_ID'], 'sourceCommit': os.environ['GITHUB_SHA'], 'outcomes': outcomes, 'newsSources': news_sources, 'reconciliation': reconciliation, 'snapshots': snapshots, 'accessVerified': False}
          status_path = Path('shared/public-catalog/collection-status.json')
          status_path.parent.mkdir(parents=True, exist_ok=True)
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(rows) + '\n')
          PY
          echo "Failed sources retain their previous catalog. Automatic collection does not verify trail access or produce navigable geometry." >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare immutable compressed catalog pages
        if: ${{ !cancelled() }}
        run: python scripts/prepare-catalog-pages.py
      - name: Publish changed snapshot
        if: ${{ !cancelled() }}
        run: |
          git add shared/data/catalog/ shared/data/content/ shared/data/offline/ shared/public-catalog/ app/cloudfunctions/catalog-feed/snapshots/ app/cloudfunctions/client-api/business/catalog-feed/snapshots/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'hiking-earth-catalog[bot]'
          git config user.email 'catalog@users.noreply.github.com'
          git commit -m 'data: refresh sourced hiking discovery catalogs'
          git push
      - name: Report complete collection failure
        if: ${{ !cancelled() && steps.usda.outcome == 'failure' && steps.osm_incremental.outcome == 'failure' && steps.osm.outcome == 'failure' && steps.hk.outcome == 'failure' && steps.content.outcome == 'failure' }}
        run: |
          echo "All collectors failed; previous snapshots retained."
          exit 1
