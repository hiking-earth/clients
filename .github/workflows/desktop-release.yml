# 桌面端跨平台构建：push tag（如 v0.1.1）后自动出 Windows MSI / macOS DMG / Linux 包并挂到 GitHub Release
# 无需本地 Windows 机器——Windows 安装包由 GitHub 的 windows-latest _runner 构建
name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Linux 依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: 安装 Tauri CLI
        working-directory: desktop
        run: npm ci

      - name: 构建并上传 Release
        working-directory: desktop
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "徒步地球桌面端 ${{ github.ref_name }}"
          releaseBody: "Tauri 壳包裹网页端（https://hiking-earth.hiking-earth.workers.dev/），网页更新即桌面端更新。"
          releaseDraft: false
          prerelease: false
